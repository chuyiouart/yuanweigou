<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星际朋友系列——长毛 | 可扫描作品卡</title>
    <meta name="theme-color" content="#171717" />
    <style>
      :root {
        --ink: #171717;
        --paper: #f2ece1;
        --line: #d8cfc1;
        --muted: #676057;
        --accent: #8c3c24;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: var(--paper);
        color: var(--ink);
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .wrap {
        width: min(100%, 1080px);
        display: grid;
        gap: 22px;
      }

      .intro {
        max-width: 760px;
      }

      .intro p {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .intro h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 72px);
        line-height: 0.98;
        letter-spacing: 0;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
        align-items: stretch;
      }

      .card {
        min-height: 650px;
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fffdf8;
        box-shadow: 0 26px 70px rgba(31, 27, 21, 0.12);
      }

      .front-image {
        height: 470px;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #151515;
      }

      .front-image img {
        max-width: 100%;
        max-height: 100%;
        display: block;
        object-fit: contain;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .card-body {
        padding: 24px 26px;
      }

      .code {
        color: var(--accent);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }

      h2 {
        margin: 10px 0 8px;
        font-size: 34px;
        line-height: 1.08;
      }

      .meta,
      .hint,
      .url {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .qr-panel {
        display: grid;
        place-items: center;
        padding: 36px 28px 20px;
      }

      .qr-box {
        width: min(100%, 330px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        padding: 18px;
        border: 1px solid #eee4d5;
        border-radius: 12px;
        background: #fff;
      }

      .qr-box img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .scan-title {
        margin: 18px 0 8px;
        text-align: center;
        font-size: 28px;
        line-height: 1.18;
      }

      .hint {
        max-width: 380px;
        margin: 0 auto;
        text-align: center;
      }

      .url {
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        overflow-wrap: anywhere;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .actions a,
      .actions button {
        border: 1px solid var(--ink);
        border-radius: 999px;
        padding: 11px 16px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-weight: 900;
        text-decoration: none;
        cursor: pointer;
      }

      .actions .secondary {
        background: transparent;
        color: var(--ink);
      }

      @media (max-width: 820px) {
        body {
          padding: 18px;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .card {
          min-height: auto;
        }

        .front-image {
          height: 390px;
        }
      }

      @media print {
        body {
          padding: 0;
          background: #fff;
        }

        .wrap {
          width: 100%;
          padding: 8mm;
        }

        .intro,
        .actions {
          display: none;
        }

        .cards {
          gap: 8mm;
        }

        .card {
          min-height: 130mm;
          box-shadow: none;
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="intro">
        <p>Printable AR Artwork Card</p>
        <h1>把这张卡显示在屏幕上，或打印出来，用手机扫入口码。</h1>
      </section>

      <section class="cards" aria-label="星际朋友系列——长毛 AR 作品卡">
        <article class="card" aria-label="作品卡正面">
          <div class="front-image">
            <img src="./assets/ar-artwork-card/changmao-original.jpg" alt="星际朋友系列——长毛 原作图" />
          </div>
          <div class="card-body">
            <span class="code">TS01-031</span>
            <h2>星际朋友系列——长毛</h2>
            <p class="meta">Young Artist · 2025 · 纸本丙烯</p>
          </div>
        </article>

        <article class="card" aria-label="作品卡背面">
          <div class="qr-panel">
            <div class="qr-box">
              <img
                src="https://api.qrserver.com/v1/create-qr-code/?size=660x660&margin=18&data=https%3A%2F%2Fchuyiouart.github.io%2Fyuanweigou%2Far-artwork-card-changmao.html%3Fv%3Dar-card-changmao-20260531"
                alt="星际朋友系列——长毛 AR 作品页入口码"
              />
            </div>
            <h2 class="scan-title">扫描打开 AR 作品</h2>
            <p class="hint">用手机相机或微信扫一扫，对准入口码，即可打开这件作品的专属 AR 页面。</p>
          </div>
          <div class="card-body">
            <span class="code">AR ARTWORK CARD</span>
            <p class="url">https://chuyiouart.github.io/yuanweigou/ar-artwork-card-changmao.html?v=ar-card-changmao-20260531</p>
          </div>
        </article>
      </section>

      <nav class="actions" aria-label="测试操作">
        <a href="./ar-artwork-card-changmao.html?v=ar-card-changmao-20260531">本机打开 AR 页面</a>
        <button class="secondary" onclick="window.print()">打印作品卡</button>
      </nav>
    </main>
  </body>
</html>
