<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>本地测试作品卡 | 长毛 AR</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px;
        background: #f2ece1;
        color: #171717;
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }

      .card {
        width: min(92vw, 460px);
        overflow: hidden;
        border: 1px solid #d8cfc1;
        border-radius: 18px;
        background: #fffdf8;
        box-shadow: 0 26px 70px rgba(31, 27, 21, 0.12);
      }

      .art {
        display: grid;
        place-items: center;
        padding: 24px;
        background: #151515;
      }

      .art img {
        width: min(100%, 310px);
        display: block;
        border: 1px solid rgba(255, 255, 255, 0.18);
      }

      .body {
        padding: 24px;
      }

      .code {
        color: #8c3c24;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
      }

      h1 {
        margin: 10px 0 8px;
        font-size: 34px;
        line-height: 1.08;
      }

      p {
        margin: 0;
        color: #676057;
        line-height: 1.7;
      }

      .qr {
        width: 280px;
        height: 280px;
        margin: 24px auto 14px;
        display: grid;
        place-items: center;
        padding: 14px;
        border: 1px solid #eee4d5;
        border-radius: 12px;
        background: #fff;
      }

      .qr img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .url {
        margin-top: 14px;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="art">
        <img src="./assets/ar-artwork-card/changmao-original.jpg" alt="星际朋友系列——长毛" />
      </div>
      <div class="body">
        <span class="code">LOCAL AR TEST CARD</span>
        <h1>星际朋友系列——长毛</h1>
        <p>手机和电脑连接同一个 Wi-Fi 后，扫描下方入口码打开识别页，再把手机摄像头对准上方作品图。</p>
        <div class="qr">
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=560x560&margin=16&data=http%3A%2F%2F192.168.31.38%3A4196%2Far-artwork-card-changmao-mindar.html%3Fv%3Dlocal-mindar-card"
            alt="本地图像识别页入口码"
          />
        </div>
        <p class="url">http://192.168.31.38:4196/ar-artwork-card-changmao-mindar.html?v=local-mindar-card</p>
      </div>
    </main>
    <script src="./unified-nav.js?v=20260711-nav-v1" defer></script>
  </body>
</html>
